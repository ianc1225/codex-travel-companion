<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Travel Companion illustrative mobile UI</title><desc id="d">Anonymized screens for an itinerary, ticket wallet, and shared ledger.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ea"/><stop offset="1" stop-color="#e7eff1"/></linearGradient><linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f56"/><stop offset="1" stop-color="#0f344a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#18313c" flood-opacity=".15"/></filter><style>.ui{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif}.sf{font-family:Georgia,'Songti SC',serif}.m{font-size:11px;font-weight:800;letter-spacing:1.2px}.n{font-size:14px}.ttl{font-size:21px;font-weight:750}.mut{fill:#71808a}.ink{fill:#18252f}</style></defs>
<rect width="1200" height="760" fill="url(#b)"/><text x="72" y="72" class="ui m" fill="#71808a">TRAVEL COMPANION · ILLUSTRATIVE UI</text><text x="72" y="116" class="sf" font-size="37" font-weight="700" fill="#18252f">A trip you can actually use on the road.</text><text x="72" y="147" class="ui n mut">Fictional Lisbon Weekend data only — no real traveller, booking or expense data.</text>
<g filter="url(#s)"><rect x="72" y="190" width="320" height="495" rx="31" fill="#fdfcf8"/><rect x="90" y="212" width="284" height="448" rx="23" fill="#f6f5f1"/><text x="112" y="250" class="sf ttl ink">Lisbon Weekend</text><text x="112" y="273" class="ui m mut">DAY 02 · SATURDAY</text><rect x="108" y="292" width="248" height="111" rx="18" fill="url(#h)"/><text x="126" y="318" class="ui m" fill="#cbdbe1">09:30 · WALKING ROUTE</text><text x="126" y="350" class="sf" font-size="24" font-weight="700" fill="#fff">Alfama morning</text><text x="126" y="374" class="ui n" fill="#e7eef1">Photo stop · coffee · viewpoint</text><rect x="108" y="418" width="248" height="62" rx="14" fill="#fff" stroke="#e5e7e4"/><text x="124" y="442" class="ui m" fill="#4e7765">CONFIRMED</text><text x="124" y="465" class="ui n" font-weight="700" fill="#18252f">11:00 · Tile Museum</text><rect x="108" y="495" width="248" height="94" rx="14" fill="#fff8eb" stroke="#e2c897"/><text x="124" y="519" class="ui m" fill="#8d5a26">TODAY'S SAFETY NOTE</text><text x="124" y="545" class="ui n" fill="#6d573c">Phones zipped away on Tram 28.</text><text x="124" y="568" class="ui n" fill="#6d573c">Take photos one person at a time.</text><rect x="108" y="604" width="248" height="37" rx="12" fill="#eaf1f4"/><text x="126" y="628" class="ui n" font-weight="700" fill="#174b6b">Maps · tickets · photo references</text></g>
<g filter="url(#s)"><rect x="440" y="190" width="320" height="495" rx="31" fill="#fdfcf8"/><rect x="458" y="212" width="284" height="448" rx="23" fill="#f6f5f1"/><text x="480" y="250" class="sf ttl ink">Trip wallet</text><text x="480" y="273" class="ui m mut">OFFLINE-READY DOCUMENTS</text><text x="480" y="313" class="sf" font-size="19" font-weight="700" fill="#18252f">Lisbon</text><text x="671" y="313" class="ui m mut">3 ITEMS</text><g class="ui"><rect x="478" y="330" width="244" height="77" rx="14" fill="#fff" stroke="#d6e1de"/><rect x="478" y="330" width="4" height="77" rx="2" fill="#4e7765"/><text x="497" y="354" class="m" fill="#4e7765">MUSEUM · CONFIRMED</text><text x="497" y="380" class="n" font-weight="700" fill="#18252f">Tile Museum</text><text x="497" y="399" class="n mut">Sat · 11:00 · 3 travellers</text><rect x="478" y="421" width="244" height="77" rx="14" fill="#fff" stroke="#e5e7e4"/><rect x="478" y="421" width="4" height="77" rx="2" fill="#706d8d"/><text x="497" y="445" class="m" fill="#706d8d">TRAIN · ISSUED</text><text x="497" y="471" class="n" font-weight="700" fill="#18252f">Lisbon → Porto</text><text x="497" y="490" class="n mut">Sun · 10:39 · open when needed</text><rect x="478" y="512" width="244" height="77" rx="14" fill="#fff" stroke="#e5e7e4"/><rect x="478" y="512" width="4" height="77" rx="2" fill="#b68b55"/><text x="497" y="536" class="m" fill="#835f34">DINING · RESERVED</text><text x="497" y="562" class="n" font-weight="700" fill="#18252f">Dinner by the river</text><text x="497" y="581" class="n mut">Sat · 19:30 · reservation details</text></g><rect x="478" y="604" width="244" height="37" rx="12" fill="#eaf1f4"/><text x="496" y="628" class="ui n" font-weight="700" fill="#174b6b">Tap to open · originals stay private</text></g>
<g filter="url(#s)"><rect x="808" y="190" width="320" height="495" rx="31" fill="#fdfcf8"/><rect x="826" y="212" width="284" height="448" rx="23" fill="#f6f5f1"/><text x="848" y="250" class="sf ttl ink">Shared expenses</text><text x="848" y="273" class="ui m mut">3 TRAVELLERS · ORIGINAL CURRENCY</text><rect x="846" y="292" width="244" height="108" rx="16" fill="#fff" stroke="#e5e7e4"/><text x="864" y="318" class="ui m" fill="#174b6b">EUR LEDGER</text><text x="864" y="352" class="sf" font-size="27" font-weight="700" fill="#18252f">€ 248.60</text><line x1="864" y1="370" x2="1072" y2="370" stroke="#e5e7e4"/><text x="864" y="389" class="ui n mut">Paid · split · settle later</text><text x="1031" y="389" class="ui n" font-weight="700" fill="#4e7765">Synced</text><text x="848" y="439" class="sf" font-size="19" font-weight="700" fill="#18252f">Who paid what</text><g class="ui"><rect x="846" y="455" width="244" height="50" rx="13" fill="#fff"/><text x="862" y="477" class="n" font-weight="700" fill="#18252f">Transit passes</text><text x="862" y="494" class="m mut">ALICE PAID · 3-WAY SPLIT</text><text x="1040" y="482" class="n" font-weight="700" fill="#18252f">€18</text><rect x="846" y="517" width="244" height="50" rx="13" fill="#fff"/><text x="862" y="539" class="n" font-weight="700" fill="#18252f">Lunch</text><text x="862" y="556" class="m mut">MATEO PAID · 2-WAY SPLIT</text><text x="1040" y="544" class="n" font-weight="700" fill="#18252f">€42</text></g><rect x="846" y="589" width="244" height="52" rx="14" fill="#174b6b"/><text x="908" y="621" class="ui n" font-weight="700" fill="#fff">+ Add an expense</text></g>
<text x="72" y="724" class="ui n" fill="#71808a">Illustrative UI only. The skill supports the process; each trip site can use its own design and data.</text>
</svg>
